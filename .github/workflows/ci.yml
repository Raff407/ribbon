name: CI

on:
  push:
    branches: [main]
  pull_request:

# The workflow only reads the repository; it can't push, release or touch settings.
permissions:
  contents: read

jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Toolchain
        run: swift --version
      - name: Build
        run: swift build
      - name: Test
        run: swift test
